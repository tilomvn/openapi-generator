base.url: http://localhost:8080
service.name: store-service
spring:
  main:
    banner-mode: "off"
  datasource:
    url: ${MYSQL_DB:jdbc:mysql://localhost:3306/store-service}
    username: ${MYSQL_USER:mysql}
    password: ${MYSQL_PASSWORD:password}
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    show-sql: true
    open-in-view: false
    generate-ddl: false
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate.ddl-auto: validate
    #`hibernate_sequence' doesn't exist
    hibernate.use-new-id-generator-mapping: false

security:
  jwt:
    secret: ASFAS#$@#%wf
    expire: 8600000
    prefix: Bearer
    issuer: sathapanaBank

merchant.host: ${MERCHANT_HOST:http://localhost:9000}
