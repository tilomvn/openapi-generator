openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v1.0.0
servers:
  - url: http://localhost:8080/
    description: Generated server url
paths:
  /v1/merchant/cashiers:
    post:
      summary: Get Cashiers
      description: get cashiers
      tags:
        - merchant-service
      operationId: getCashiers
      parameters:
        - in: header
          name: userId
          schema:
            type: string
          required: true
          description: UserId
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashierRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashiersResponse'
        '400':
          description: bad request
          $ref: '#/components/responses/BadRequest'
        '404':
          description: not found
          $ref: '#/components/responses/NotFound'
        '500':
          description: internal server error
          $ref: '#/components/responses/ServerError'
components:
  schemas:
    CashierRequest:
      type: object
      required:
        - merchantId
      properties:
        merchantId:
          type: string
    CashiersResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Cashier'
    Cashier:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        status:
          type: string
        id:
          type: string
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
  responses:
    Conflicted:
      description: duplicate merchant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad Request Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
